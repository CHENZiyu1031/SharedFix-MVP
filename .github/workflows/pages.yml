name: Deploy SharedFix browser demo

on:
  push:
    branches:
      - Improvement1_1

concurrency:
  group: sharedfix-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm exec --yes --package=pnpm@9 -- pnpm install --frozen-lockfile
      - name: Build static demo
        run: node browser-build.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
